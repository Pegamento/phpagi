name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHP version guard
        id: php_guard
        run: |
          php .github/scripts/php-version-guard.php | tee guard.out
          if grep -q '^warning=' guard.out; then
            warning="$(grep '^warning=' guard.out | cut -d= -f2-)"
            echo "::warning::$warning"
          fi
          if grep -q '^status=ignored' guard.out; then
            message="$(grep '^message=' guard.out | cut -d= -f2-)"
            echo "$message"
          fi

      - name: Open issue when PHP patch lag exceeds 7 days
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(grep '^status=' guard.out | cut -d= -f2- || true)"
          lag_days="$(grep '^lag_days=' guard.out | cut -d= -f2- || true)"
          if [ "$status" != "behind" ] || [ -z "$lag_days" ] || ! [[ "$lag_days" =~ ^[0-9]+$ ]] || [ "$lag_days" -le 7 ]; then
            exit 0
          fi
          installed="$(grep '^installed=' guard.out | cut -d= -f2- || true)"
          latest="$(grep '^latest=' guard.out | cut -d= -f2- || true)"
          release_date="$(grep '^release_date=' guard.out | cut -d= -f2- || true)"
          title="CI is behind php.net PHP ${{ matrix.php }}"
          body="$(cat <<EOF
          Weekly CI detected that the PHP patch level is more than 7 days behind php.net.

          - Installed: ${installed}
          - Latest on php.net: ${latest}
          - Release date: ${release_date}
          - Lag (days): ${lag_days}
          EOF
          )"
          existing="$(gh issue list --state open --json number,title --jq "[.[] | select(.title==\"${title}\") | .number][0] // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Run tests
        run: composer test

      - name: Report weekly CI failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CI weekly failure (PHP ${{ matrix.php }})"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="$(cat <<EOF
          The scheduled CI run failed for PHP ${{ matrix.php }}.

          Run: ${run_url}
          EOF
          )"
          existing="$(gh issue list --state open --json number,title --jq "[.[] | select(.title==\"${title}\") | .number][0] // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  tests-lowest:
    name: tests-lowest (PHP 8.4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-8.4-

      - name: Install dependencies (lowest)
        run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Run tests
        run: composer test

  static-analysis:
    name: static-analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer phpstan

  code-style:
    name: code-style (PHP 8.5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-8.5-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-8.5-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: composer cs-check

  composer:
    name: composer (PHP 8.5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-8.5-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-8.5-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validate and audit Composer metadata
        run: |
          composer validate --strict
          composer audit
          composer normalize --dry-run

  coverage:
    name: coverage (PHP 8.5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-8.5-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-8.5-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPUnit coverage or tests-only
        id: coverage
        run: |
          if find src -name '*.php' -print -quit | grep -q .; then
            mkdir -p build
            vendor/bin/phpunit --coverage-clover build/clover.xml
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "No PHP sources in src/; running composer test without Clover output."
            composer test
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Clover coverage
        if: steps.coverage.outputs.upload == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-clover
          path: build/clover.xml
          if-no-files-found: error

  next-php:
    name: next-php (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: nightly
          coverage: none

      - name: Show PHP environment
        run: |
          php -v
          php -m

      - name: Resolve Composer cache directory
        id: composer_cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-nightly-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-nightly-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test
